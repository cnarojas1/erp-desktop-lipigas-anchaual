[package]
name = "app"
version = "0.1.0"
description = "ERP Client - offline sin DTE"
authors = ["Digitaliza"]
license = "MIT"
edition = "2024"
rust-version = "1.70"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["plugin:log"] }
tauri-plugin-log = "2"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "derive"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"
anyhow = "1.0"